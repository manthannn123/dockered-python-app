services:
  app-db:
    container_name: db-app
    image: mysql-app:latest
    volumes: 
      - app-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "task_manager"
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-proot", "-e", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    image: backend-app:latest
    networks:
      - app
    container_name: "api-app"
    environment:
      DB_HOST: app-db
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-task_manager}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    image: frontend-app:latest
    restart: always
    ports:
      - "0.0.0.0:80:80"
    networks:
      - app
    container_name: "frontend-app"
    depends_on:
      api:
        condition: service_healthy
volumes:
  app-db:
networks:
  app:
    driver: bridge
  


    

